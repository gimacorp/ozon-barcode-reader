name: Полное воспроизведение экспериментов
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/reproduce.py
      - uses: actions/upload-artifact@v4
        with:
          name: Полный-эксперимент
          path: |
            results/
            output/pdf/
            notebooks/demo_ru.ipynb
